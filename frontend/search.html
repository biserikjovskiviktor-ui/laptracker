<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap Tracker - Именик на Возачи</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="stopwatch.html">🏎️ LapTracker</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="stopwatch.html">Штоперица</a>
                <a class="nav-link" href="add-vehicle.html">Додај Возило</a>
                <a class="nav-link" href="add-course.html">Додај Патека</a>
                <a class="nav-link" href="leaderboard.html">Табела</a>
                <a class="nav-link active" href="search.html">🔍 Пребарај Возачи</a>
            </div>
            <div class="navbar-nav">
                <a class="nav-link fw-bold text-warning" href="profile.html">👤 Мој Профил</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <h3 class="fw-bold text-uppercase text-center mb-4">🔍 Именик на Активни Возачи</h3>

                <!-- Search Input Group -->
                <div class="card bg-black border border-secondary p-3 mb-4 shadow">
                    <div class="input-group">
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Пребарај возачи по име или град...">
                        <button class="btn btn-danger text-uppercase fw-bold" type="button">Барај</button>
                    </div>
                </div>

                <!-- Directory List -->
                <div class="card bg-black border border-secondary p-4 shadow">
                    <h6 class="text-secondary text-uppercase fw-bold mb-3 small">Регистрирани Корисници</h6>
                    
                    <!-- Driver 1 -->
                    <div class="d-flex justify-content-between align-items-center p-3 mb-2 bg-dark rounded border border-secondary">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center fw-bold me-3" style="width: 50px; height: 50px;">И</div>
                            <div>
                                <h6 class="m-0 fw-bold">Игор_BT</h6>
                                <small class="text-muted">Град: Битола | Возила во гаража: 1</small>
                            </div>
                        </div>
                        <a href="public-profile.html" class="btn btn-outline-warning btn-sm px-4 fw-bold text-uppercase">Види Профил</a>
                    </div>

                    <!-- Driver 2 -->
                    <div class="d-flex justify-content-between align-items-center p-3 bg-dark rounded border border-secondary">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center fw-bold me-3" style="width: 50px; height: 50px;">М</div>
                            <div>
                                <h6 class="m-0 fw-bold">Марко_SK</h6>
                                <small class="text-muted">Град: Скопје | Возила во гаража: 2</small>
                            </div>
                        </div>
                        <a href="public-profile.html" class="btn btn-outline-warning btn-sm px-4 fw-bold text-uppercase">Види Профил</a>
                    </div>

                </div>

            </div>
        </div>
    </div>

</html>
