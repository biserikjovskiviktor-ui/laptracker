<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap Tracker - Најава / Регистрација</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-md-5">
                
                <!-- Logo / Header -->
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-danger text-uppercase m-0">🏎️ LapTracker</h1>
                    <p class="text-secondary small">Систем за следење на времиња на патеки</p>
                </div>

                <!-- Auth Card Box -->
                <div class="card bg-black border border-secondary p-4 shadow-lg rounded">
                    
                    <!-- Navigation Tabs to switch between Login and Register -->
                    <ul class="nav nav-tabs nav-fill mb-4 border-secondary" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-uppercase fw-bold text-danger bg-transparent border-0" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Најава</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-uppercase fw-bold text-secondary bg-transparent border-0" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Регистрација</button>
                        </li>
                    </ul>

                    <!-- Tab Content Panels -->
                    <div class="tab-content" id="authTabsContent">
                        
                        <!-- 1. LOGIN PANEL -->
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label text-secondary small">Е-пошта (Email)</label>
                                    <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="viktortest@email.com" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-secondary small">Лозинка</label>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                                </div>
                                <div class="d-grid">
                                    <a href="stopwatch.html" class="btn btn-danger btn-lg fw-bold text-uppercase">Влези</a>
                                </div>
                            </form>
                        </div>

                        <!-- 2. REGISTRATION PANEL -->
                        <div class="tab-pane fade" id="register-panel" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label text-secondary small">Корисничко Име</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Виктор" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary small">Е-пошта (Email)</label>
                                    <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="viktortest@email.com" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-secondary small">Лозинка</label>
                                    <!-- For Part 4, we will validate this with Regex patterns -->
                                    <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="Минимум 6 карактери" required>
                                </div>
                                <div class="d-grid">
                                    <a href="stopwatch.html" class="btn btn-success btn-lg fw-bold text-uppercase">Креирај Профил</a>
                                </div>
                            </form>
                        </div>

                    </div>

                </div>

                <!-- Back button placeholder for guests -->
                <div class="text-center mt-3">
                    <a href="leaderboard.html" class="text-secondary small text-decoration-none">Продолжи како Гостин (Само Преглед) ➔</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle link (Needed to make the tabs switch visually when clicked) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
