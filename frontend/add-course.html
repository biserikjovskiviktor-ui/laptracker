<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap Tracker - Додај Патека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="#">🏎️ LapTracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="stopwatch.html">Штоперица</a>
                <a class="nav-link" href="add-vehicle.html">Додај Возило</a>
                <a class="nav-link active" href="add-course.html">Додај Патека</a>
                <a class="nav-link" href="leaderboard.html">Табела</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card bg-black border border-secondary p-4 shadow-lg rounded">
                    <h3 class="text-center text-uppercase fw-bold text-danger mb-4">📍 Креирај Нова Патека</h3>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Име на Патека / Локација</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Пр. Стрив (Битола), Плетвар, Водно" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Тип на подлога (Коловоз)</label>
                            <select class="form-select bg-dark text-white border-secondary" required>
                                <option value="" disabled selected>-- Избери подлога --</option>
                                <option value="asphalt">Асфалт (Мазен)</option>
                                <option value="rough_asphalt">Груб / Оштетен Асфалт</option>
                                <option value="cobblestone">Коцка / Калдрма</option>
                                <option value="dirt">Земја / Максфалт</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Приближна Должина (Километри)</label>
                            <div class="input-group">
                                <input type="number" step="0.1" class="form-control bg-dark text-white border-secondary" placeholder="Пр. 4.2" required>
                                <span class="input-group-text bg-secondary text-white border-secondary">km</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary fw-bold">Опис на Рута (Старт / Цел маркер)</label>
                            <textarea class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Пр. Старт од бензинската станица, финиш кај чешмата на врвот на ридот..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-danger btn-lg fw-bold text-uppercase">Додај Патека во Систем</button>
                            <a href="stopwatch.html" class="btn btn-outline-secondary text-light">Назад кон Штоперица</a>
                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-4 border-top border-secondary text-muted bg-black mt-5">
        <p class="m-0">&copy; 2026 Лап Тракер Апликација</p>
    </footer>

</body>
</html>
