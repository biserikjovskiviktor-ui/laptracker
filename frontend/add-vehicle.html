<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap Tracker - Додај Возило</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="#">🏎️ LapTracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="stopwatch.html">Штоперица</a>
                <a class="nav-link active" href="add-vehicle.html">Додај Возило</a>
                <a class="nav-link" href="add-course.html">Додај Патека</a>
                <a class="nav-link" href="leaderboard.html">Табела</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card bg-black border border-secondary p-4 shadow-lg rounded">
                    <h3 class="text-center text-uppercase fw-bold text-danger mb-4">Гаража: Додај Ново Возило</h3>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Бренд / Производител</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Пр. Zastava, Seat, Ford" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Модел</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Пр. Yugo, Ibiza, Focus" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Година на производство</label>
                            <input type="number" class="form-control bg-dark text-white border-secondary" placeholder="Пр. 1998" min="1900" max="2026" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">Моќност (КС / HP)</label>
                            <div class="input-group">
                                <input type="number" class="form-control bg-dark text-white border-secondary" placeholder="Пр. 65" required>
                                <span class="input-group-text bg-secondary text-white border-secondary">конски сили</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary fw-bold">Спецификации / Модификации (Опционално)</label>
                            <textarea class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Пр. 1.3 EFI мотор, олеснет замаец, спуштена шасија..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-danger btn-lg fw-bold text-uppercase">Зачувај Возило во Гаража</button>
                            <a href="stopwatch.html" class="btn btn-outline-secondary text-light">Назад кон Штоперица</a>
                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-4 border-top border-secondary text-muted bg-black mt-5">
        <p class="m-0">&copy; 2026 Лап Тракер Апликација</p>
    </footer>

</body>
</html>
