
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <div class="container text-center py-4">
        <h2 class="mb-3 fw-bold text-uppercase">Мерење на Време</h2>

        <div class="row g-3 justify-content-center mb-4">
            <div class="col-md-3">
                <div class="text-white text-uppercase fw-bold">Track</div>
                <select id="courseSelect" class="form-select bg-dark text-white border-secondary" onchange="checkInputs()">
                    <option value="" disabled selected>Избери Патека</option>
                </select>
            </div>
            <div class="col-md-3">
                <div class="text-white text-uppercase fw-bold">Car</div>
                <select id="vehicleSelect" class="form-select bg-dark text-white border-secondary" onchange="checkInputs()">
                    <option value="" disabled selected>Избери Возило</option>
                </select>
            </div>
            <div class="col-md-3">
                <div id="pbPreStartDisplay" class="card bg-black border border-warning text-dark p-3 h-100 fw-bold" style="display: none;">
                    <p class="mb-0 text-secondary text-uppercase fw-bold small"> Time to beat</p>
                    <h5 id="pbTimeValue" class="m-0 text-warning fw-bold">--:--:--.---</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div id="liveWeatherDisplay"class="card bg-black border border-primary text-secondary fw-bold d-flex align-items-center justify-content-center p-3 h-100">
                    Вчитување на временски услови...
                </div>
            </div>
        </div>
        
        <div id="countdownDisplay" class="display-1 fw-bold my-3 text-warning" style="display: none;">3</div>
        
        <div class="bg-black border border-warning rounded p-4 my-4 shadow-lg">
            <div id="display" class="stopwatch-display text-warning h4">00:00:00.000</div>
        </div>

        <div id="controlsContainer" class="text-center my-4">
            <button id="startBtn" class="btn btn-lg btn-success px-5" onclick="startTimer()">START</button>
            <button id="stopBtn" class="btn btn-lg btn-danger px-5" style="display: none;" onclick="stopTimer()">STOP</button>
        </div>

        <div id="result-panel" class="card bg-black border border-secondary p-4 my-4 shadow-lg mx-auto" style="display: none; max-width: 600px;">
            <h5 class="text-uppercase text-warning fw-bold mb-3">Резултат од Рундата</h5>
            <div class="row g-3 text-center mb-4">
                <div class="col-6">
                    <div class="bg-dark p-2 rounded border border-secondary">
                        <small class="text-secondary d-block">Твое време</small>
                        <div id="currentTimeDisplay" class="h4 text-light">00:00:00.000</div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="bg-dark p-2 rounded border border-secondary">
                        <small class="text-secondary d-block">Time to beat</small>
                        <div id="previousTimeDisplay" class="h4 text-info">--:--:--.---</div>
                    </div>
                </div>
            </div>
            <div class="row g-3 text-center mb-4">
                <div class="bg-dark p-2 rounded border border-secondary">
                    <small class="text-secondary d-block">Разлика</small>
                    <div id="timeDifferenceDisplay" class="h1 fw-bold text-light">00:00:00.000</div>
                </div>
            </div>
            <div id="comparisonStatus" class="fw-bold fs-5 mb-4"></div>
            <div class="d-flex justify-content-center gap-3">
                <button id="saveRunBtn" onclick="saveCurrentLap()" class="btn btn-success fw-bold text-uppercase">Зачувај Време</button>
                <button id="discardRunBtn" onclick="resetTimer()" class="btn btn-outline-danger fw-bold text-uppercase">Откажи</button>
            </div>
        </div>
    </div>
