<div class="card bg-secondary text-white p-4 mx-auto" style="max-width: 400px;">
    <h3 id="authTitle">Добредојдовте</h3>
    
    <input type="text" id="username" class="form-control mb-2" placeholder="Корисничко име" style="display: none;">
    
    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-2" placeholder="Лозинка">
    
    <div class="d-grid gap-2">
        <button id="mainBtn" class="btn btn-primary" onclick="handleLogin()">Најава</button>
        <button id="toggleBtn" class="btn btn-outline-light" onclick="toggleMode()">Регистрација</button>
    </div>
</div>
